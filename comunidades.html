<!-- comunidades.html -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Comunidades — Vibra™
  </title>

  <link
    rel="icon"
    type="image/png"
    href="./assets/Vibra_icon.png"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <!-- TOPO -->

  <header class="top-header">

    <div class="logo-area">

      <img
        src="./assets/Vibra_logo.png"
        class="logo"
      >

    </div>

    <div class="header-links">

      <a href="index.html">
        Home
      </a>

      |

      <a href="sobre.html">
        Sobre
      </a>

      |

      <a href="comunidades.html">
        Comunidades
      </a>

      |

      <a href="chat.html">
        Chat
      </a>

      |

      <a href="perfil.html">
        Perfil
      </a>

    </div>

  </header>

  <!-- CONTEÚDO -->

  <main class="main-layout">

    <!-- ESQUERDA -->

    <section class="left-content">

      <!-- CRIAR -->

      <div class="box">

        <div class="box-title orange">

          Criar Comunidade

        </div>

        <div class="create-community">

          <input
            type="text"
            id="communityName"
            placeholder="Nome da comunidade"
          >

          <textarea
            id="communityDescription"
            placeholder="Descrição da comunidade"
          ></textarea>

          <button id="createCommunityButton">

            Criar Comunidade

          </button>

        </div>

      </div>

      <!-- LISTA -->

      <div class="box">

        <div class="box-title purple">

          Comunidades Vibra™

        </div>

        <div id="communitiesContainer">

          Carregando comunidades...

        </div>

      </div>

    </section>

    <!-- DIREITA -->

    <aside class="right-content">

      <div class="side-box">

        <h3>
          Comunidades
        </h3>

        <p>

          Encontre pessoas com os mesmos interesses.

        </p>

      </div>

      <div class="side-box">

        <h3>
          Dica
        </h3>

        <p>

          Crie comunidades retrô, divertidas
          e criativas 😄

        </p>

      </div>

    </aside>

  </main>

  <!-- RODAPÉ -->

  <footer>
<p>© Retropixel™, 2025-2026. Todos os direitos reservados.</p>
  </footer>

  <!-- SOM -->

  <audio
    id="clickSound"
    src="./assets/click.wav"
    preload="auto"
  ></audio>

  <!-- SCRIPT -->

  <script
    type="module"
    src="comunidades.js"
  ></script>

</body>
</html>
